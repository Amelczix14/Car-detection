<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function fetchHistory() {
    fetch('/history').then(res => res.json()).then(data => {
      const table = document.getElementById('history-table');
      table.innerHTML = '';
      data.forEach(item => {
        const row = `<tr>
          <td>${item.plate_number}</td>
          <td><span class="badge ${item.status === 'GRANTED' ? 'bg-success' : 'bg-danger'}">${item.status}</span></td>
          <td>${new Date(item.timestamp).toLocaleString('pl-PL', { timeZone: 'Europe/Warsaw' })}</td>



        </tr>`;
        table.innerHTML += row;
      });
    });
  }

  function fetchPlates() {
    fetch('/plates').then(res => res.json()).then(data => {
      const list = document.getElementById('plate-list');
      list.innerHTML = '';
      data.forEach(plate => {
        const item = document.createElement('li');
        item.className = 'list-group-item d-flex justify-content-between align-items-center';
        item.innerHTML = `${plate} <button class="btn btn-outline-danger btn-sm" onclick="deletePlate('${plate}')"><i class="fas fa-trash"></i></button>`;
        list.appendChild(item);
      });
    });
  }

  function addPlate() {
    const plate = document.getElementById('new-plate').value.trim().toUpperCase();
    if (!plate) return;
    fetch('/grant_access', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ plate_number: plate })
    }).then(() => {
      document.getElementById('new-plate').value = '';
      fetchPlates();
    });
  }

  function deletePlate(plate) {
    fetch('/delete_plate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ plate_number: plate })
    }).then(fetchPlates);
  }

  document.querySelector('[data-bs-target="#history"]').addEventListener('click', fetchHistory);
  document.querySelector('[data-bs-target="#manage"]').addEventListener('click', fetchPlates);
</script>
<script>
  async function runDetection() {
    const resultsDiv = document.getElementById('presentation-results');
    resultsDiv.textContent = "Trwa wykrywanie...";

    try {
      const videoRes = await fetch('/current_video');
      const videoData = await videoRes.json();
      const currentVideo = videoData.filename;

      const response = await fetch('/run_detection', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ video_file: currentVideo })
      });

      const data = await response.json();
      if (response.ok) {
        if (data.plate_number) {
          resultsDiv.textContent = `Wykryta tablica: ${data.plate_number} (pewność: ${(data.confidence * 100).toFixed(1)}%)`;
        } else {
          resultsDiv.textContent = data.message || "Nie wykryto tablicy.";
        }
      } else {
        resultsDiv.textContent = `Błąd: ${data.error || 'Nieznany błąd'}`;
      }
    } catch (err) {
      resultsDiv.textContent = "Błąd połączenia z serwerem.";
      console.error(err);
    }
  }
</script>
<script>
function loadPresentationVideo(filename) {
  const videoElement = document.getElementById("presentation-video");
  const status = document.getElementById("detection-status");

  videoElement.style.border = "none";
  videoElement.src = `/video_with_detection?video=${filename}&reset=true&t=${Date.now()}`;
  status.innerText = "Przetwarzanie...";
  status.style.color = "gray";

  lastPlate = null;
  lastStatus = null;
}

function hideLoading() {
  document.getElementById("detection-status").innerText = "";
}

function showError() {
  document.getElementById("detection-status").innerText = "Błąd podczas ładowania filmu.";
}
</script>

<!--</script>-->
<script>
  let lastPlate = null;
  let lastStatus = null;

  setInterval(() => {
    fetch('/latest_detection')
      .then(response => response.json())
      .then(data => {
        const statusEl = document.getElementById("detection-status");
        const liveStatusEl = document.getElementById("live-detection-status");
        if (!data || !data.plate) return;

        let extraInfo = "";
        if (data.brand || data.color) {
          extraInfo = " | ";
          if (data.brand) {
            extraInfo += `marka: ${data.brand}`;
          }
          if (data.color) {
            if (data.brand) extraInfo += ", ";
            extraInfo += `kolor: ${data.color}`;
          }
        }

        let statusText = "";
        let statusColor = "";

        if (data.status === "GRANTED") {
          statusText = `✅ ${data.plate} — dostęp przyznany${extraInfo}`;
          statusColor = "green";
          if (lastStatus !== "GRANTED") showToast("Przyznano dostęp");
        } else if (data.status === "DENIED") {
          statusText = `❌ ${data.plate} — brak dostępu${extraInfo}`;
          statusColor = "red";
        } else {
          statusText = "Przetwarzanie...";
          statusColor = "gray";
        }

        // Aktualizacja obu zakładek
        if (statusEl) {
          statusEl.innerText = statusText;
          statusEl.style.color = statusColor;
        }
        if (liveStatusEl) {
          liveStatusEl.innerText = statusText;
          liveStatusEl.style.color = statusColor;
        }

        lastStatus = data.status;
        lastPlate = data.plate;
      });
  }, 1000);
</script>
